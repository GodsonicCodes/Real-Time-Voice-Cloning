version: '3.8'

services:
  # Voice Cloning API
  voice-api:
    build: .
    container_name: voice-cloning-api
    ports:
      - "8000:8000"
      - "9090:9090"  # Metrics
    environment:
      # API Configuration
      - TTS_DEVICE=cpu  # Change to 'cuda' if GPU available
      - API_TITLE=Voice Cloning API
      - API_VERSION=1.0.0

      # Performance
      - ENABLE_CACHING=true
      - CACHE_MAX_SIZE_GB=5.0

      # Natural Speech
      - ADD_NATURAL_PAUSES=true
      - ADD_BREATHING=true

      # Redis (if using)
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=false

      # Monitoring
      - ENABLE_METRICS=true

    volumes:
      # Persist voice library
      - ./api/voices:/app/api/voices
      # Persist cache
      - ./api/cache:/app/api/cache

    restart: unless-stopped

    # GPU support (uncomment if using NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Redis (optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: voice-api-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx reverse proxy (optional - for production)
  nginx:
    image: nginx:alpine
    container_name: voice-api-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - voice-api
    restart: unless-stopped

volumes:
  redis-data:

networks:
  default:
    name: voice-api-network
